server:
  port: 8080
tern:
  # Defaults are the Kubernetes service addresses; docker-compose overrides them via env.
  antarctic:
    target: ${ANTARCTIC_TARGET:antarctic.default.svc.cluster.local:30000}
    # Bounds every gRPC call. Without it an unreachable antarctic makes callers wait for the
    # servlet async timeout and answers 500, instead of failing fast with a 503.
    deadline: ${ANTARCTIC_DEADLINE:2s}
  translate:
    url: ${TRANSLATE_URL:http://libretranslate:5000}
    timeout: ${TRANSLATE_TIMEOUT:1s}
spring:
  flyway:
    baselineOnMigrate: true
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:5432/${POSTGRES_DB:postgres}
    driver-class-name: org.postgresql.Driver
    username: ${POSTGRES_USER} #postgres
    password: ${POSTGRES_PASSWORD} #password
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        ddl-auto: none
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  metrics:
    tags:
      # Lets one Prometheus scrape both roles and tell them apart.
      application: ${SERVICE_NAME:tern}
    distribution:
      # Without buckets Micrometer only reports count, sum and max - enough for a mean, not
      # for a percentile. These make histogram_quantile() work in Prometheus.
      percentiles-histogram:
        http.server.requests: true
      slo:
        http.server.requests: 50ms,100ms,250ms,500ms,1s,2s,5s
  endpoint:
    health:
      probes:
        enabled: true          # exposes /actuator/health/liveness and /readiness for k8s
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
logging:
  level:
    # At INFO each service logs one line per request: the point it enters. Set this to DEBUG
    # (or LOGGING_LEVEL_TERN=DEBUG) for the full hop-by-hop trace with statuses and timings.
    tern: ${LOG_LEVEL:INFO}
  pattern:
    # Puts the per-request id next to the level, so `docker compose logs -f` can be grepped
    # by id to follow one request across artic and antarctic. SERVICE_NAME labels which of
    # the two roles the container is running.
    level: "%5p [${SERVICE_NAME:tern}] [%X{requestId:-              }]"
