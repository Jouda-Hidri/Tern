syntax = "proto3";
package tern.grpc;
import "google/protobuf/empty.proto";

message Message {
  reserved 1;
  string text = 2;
  // Empty when the detector was unavailable.
  string language = 3;
}

message SaveRequest {
  string text = 1;
  reserved 2;
}

message SaveResponse {
  reserved 1;
  string language = 2;
}

service TernService {
  rpc GetMessage (google.protobuf.Empty) returns (stream Message) {}
  rpc SaveMessage (SaveRequest) returns (SaveResponse);
}
