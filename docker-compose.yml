services:
  # Mirrors the Kubernetes topology: the same image runs twice, as the REST
  # front end (artic, 8080) and as the gRPC back end (antarctic, 9090).
  artic:
    build: ./
    ports:
      - "8080:8080"
    depends_on:
      dbpostgresql:
        condition: service_healthy
      antarctic:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
      - ANTARCTIC_TARGET=antarctic:9090
      - SERVICE_NAME=artic
      # LOG_LEVEL=DEBUG turns the one-line-per-entry default into the full hop-by-hop trace
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      # The alert-investigation workflow. Off unless the `workflow` profile is up, because it
      # needs the MCP servers that profile starts. See docs/workflow.md.
      - WORKFLOW_ENABLED=${WORKFLOW_ENABLED:-false}
      # `cli` is not available in here: it needs the Claude Code session on your machine.
      - WORKFLOW_INVESTIGATOR=${WORKFLOW_INVESTIGATOR:-api}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PROMETHEUS_MCP_URL=${PROMETHEUS_MCP_URL:-http://prometheus-mcp:8000/mcp}
      - DOCKER_MCP_URL=${DOCKER_MCP_URL:-http://docker-mcp:8000/mcp}
      - GRAFANA_MCP_URL=${GRAFANA_MCP_URL:-}
      - KUBERNETES_MCP_URL=${KUBERNETES_MCP_URL:-}
      - WORKFLOW_WEBHOOK_SECRET=${WORKFLOW_WEBHOOK_SECRET:-}
      - WORKFLOW_SINK_URL=${WORKFLOW_SINK_URL:-}
      - WORKFLOW_SINK_TOKEN=${WORKFLOW_SINK_TOKEN:-}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  antarctic:
    build: ./
    ports:
      - "9090:9090"
    depends_on:
      dbpostgresql:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
      - SERVICE_NAME=antarctic
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TRANSLATE_URL=${TRANSLATE_URL:-http://libretranslate:5000}
      - BACKFILL_ENABLED=${BACKFILL_ENABLED:-true}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  dbpostgresql:
    # Pinned. `postgres` unpinned means a major upgrade lands on a `docker compose pull` and
    # refuses to start on the old data directory. 14 is also what the integration test and the
    # Kubernetes manifests use, and what this Flyway version supports without warning.
    image: postgres:14
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
    volumes:
      # Without this the database lives in an anonymous volume and every `down` silently
      # discards it. Named, so data survives a restart and `down -v` is what clears it -
      # matching the PersistentVolumeClaim the Kubernetes manifests use.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: [ "translate" ]
    ports:
      - "5050:5000"
    environment:
      # Only the languages this project's sample data uses, so startup stays reasonable.
      - LT_LOAD_ONLY=en,fr,ru,es
      - LT_DISABLE_WEB_UI=true
    volumes:
      # Models are downloaded on first boot; keeping them means later starts are quick.
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      # The image ships no curl or wget, so the check uses the python it runs on.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s

  # Everything below is the `workflow` profile: the alert source, and the MCP servers the
  # investigation reads through. incident.io is not here and cannot be - it is SaaS only.
  prometheus:
    image: prom/prometheus:v2.54.1
    profiles: [ "workflow" ]
    ports:
      # Host ports only, for you to look at. The services find each other by name on the compose
      # network, so overriding these when another stack already owns 9091 or 3000 changes nothing.
      - "${PROMETHEUS_PORT:-9091}:9090"
    volumes:
      - ./deployment/workflow/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deployment/workflow/rules.yml:/etc/prometheus/rules.yml:ro
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-lifecycle
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

  alertmanager:
    image: prom/alertmanager:v0.27.0
    profiles: [ "workflow" ]
    # Docker Desktop resolves host.docker.internal on its own; this is what makes the same
    # alertmanager.yml work on Linux, where it is not a magic name.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${ALERTMANAGER_PORT:-9093}:9093"
    volumes:
      - ./deployment/workflow/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9093/-/healthy"]
      interval: 10s
      timeout: 5s
      retries: 12

  prometheus-mcp:
    # Reads Prometheus over its HTTP API and exposes query/range-query/label tools over MCP.
    image: ghcr.io/pab1it0/prometheus-mcp-server:latest
    profiles: [ "workflow" ]
    ports:
      - "8000:8000"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - PROMETHEUS_MCP_SERVER_TRANSPORT=http
      - PROMETHEUS_MCP_BIND_HOST=0.0.0.0
      - PROMETHEUS_MCP_BIND_PORT=8000
    depends_on:
      prometheus:
        condition: service_healthy

  grafana:
    image: grafana/grafana:11.2.0
    profiles: [ "workflow" ]
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=true
    volumes:
      - ./deployment/workflow/grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - grafana-data:/var/lib/grafana

  docker-socket-proxy:
    # The Docker socket is root on the host: anything holding it can start a privileged container
    # and own the machine. Mounting it `:ro` does not help - the socket is an API endpoint, and a
    # read-only bind mount does not stop write calls through it. This proxy is what actually makes
    # it read-only, by allowing GET on the container endpoints and refusing everything else, so a
    # bug or an injected instruction in the investigation cannot reach a mutating API at all.
    image: tecnativa/docker-socket-proxy:0.3.0
    profiles: [ "workflow" ]
    environment:
      - CONTAINERS=1
      - POST=0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped

  docker-mcp:
    # Answers what Prometheus cannot: why a container went away, and what it said on the way out.
    image: codeberg.org/jhot/docker-mcp:latest
    profiles: [ "workflow" ]
    ports:
      - "${DOCKER_MCP_PORT:-8002}:8000"
    environment:
      - DOCKER_HOST=tcp://docker-socket-proxy:2375
    depends_on:
      - docker-socket-proxy

  grafana-mcp:
    # Needs a Grafana service account token; without one, leave GRAFANA_MCP_URL unset and the
    # investigation runs on the Prometheus MCP server alone.
    image: mcp/grafana:latest
    profiles: [ "workflow" ]
    ports:
      - "8001:8000"
    environment:
      - GRAFANA_URL=http://grafana:3000
      - GRAFANA_SERVICE_ACCOUNT_TOKEN=${GRAFANA_TOKEN:-}
      - GRAFANA_API_KEY=${GRAFANA_TOKEN:-}
    command: ["-t", "streamable-http", "--address", "0.0.0.0:8000"]
    depends_on:
      - grafana

volumes:
  postgres-data:
  libretranslate-models:
  grafana-data:
