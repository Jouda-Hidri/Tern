services:
  # Mirrors the Kubernetes topology: the same image runs twice, as the REST
  # front end (artic, 8080) and as the gRPC back end (antarctic, 9090).
  artic:
    build: ./
    ports:
      - "8080:8080"
    depends_on:
      dbpostgresql:
        condition: service_healthy
      antarctic:
        condition: service_healthy
      tapi:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
      - ANTARCTIC_TARGET=antarctic:9090
      - SERVICE_NAME=artic
      # LOG_LEVEL=DEBUG turns the one-line-per-entry default into the full hop-by-hop trace
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - TRANSLATE_URL=${TRANSLATE_URL:-http://libretranslate:5000}
      - TAPI_URL=${TAPI_URL:-http://tapi:5000}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  antarctic:
    build: ./
    ports:
      - "9090:9090"
    depends_on:
      dbpostgresql:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
      - SERVICE_NAME=antarctic
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 30s
  dbpostgresql:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Third-party language detection, behind a profile because the image is ~800MB and downloads
  # its models on first boot. Left out, artic simply stores messages without a language, which
  # is the degraded path worth demonstrating: `docker compose up` stays fast and still works.
  # Start it with: docker compose --profile translate up -d
  libretranslate:
    image: libretranslate/libretranslate:latest
    profiles: [ "translate" ]
    ports:
      - "5050:5000"
    environment:
      # Only the languages this project's sample data uses, so startup stays reasonable.
      - LT_LOAD_ONLY=en,fr,ru,es
      - LT_DISABLE_WEB_UI=true
    volumes:
      # Models are downloaded on first boot; keeping them means later starts are quick.
      - libretranslate-models:/home/libretranslate/.local
    healthcheck:
      # The image ships no curl or wget, so the check uses the python it runs on.
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/languages', timeout=5)"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 180s

  # The CSV source artic streams after a save. Built from its own repo, since the image is
  # not published anywhere; everything else it needs is in that repo's own Dockerfile.
  tapi:
    build:
      context: https://github.com/Jouda-Hidri/tapi.git
    ports:
      - "5000:5000"
    healthcheck:
      # A GET would stream 200MB, so the check only proves the port is accepting connections.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5000), 5)"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  libretranslate-models:
