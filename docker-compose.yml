services:
  # Mirrors the Kubernetes topology: the same image runs twice, as the REST
  # front end (artic, 8080) and as the gRPC back end (antarctic, 9090).
  artic:
    build: ./
    ports:
      - "8080:8080"
    depends_on:
      dbpostgresql:
        condition: service_healthy
      antarctic:
        condition: service_started
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
      - ANTARCTIC_TARGET=antarctic:9090
      - SERVICE_NAME=artic
  antarctic:
    build: ./
    ports:
      - "9090:9090"
    depends_on:
      dbpostgresql:
        condition: service_healthy
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
      - SERVICE_NAME=antarctic
  dbpostgresql:
    image: postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=password
      - POSTGRES_USER=postgres
      - POSTGRES_DB=polldb
      - POSTGRES_HOST=dbpostgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 2s
      timeout: 3s
      retries: 15
