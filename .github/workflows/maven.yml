name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      # Kotlin 1.7.10 cannot parse the version string of very recent JDKs, so the toolchain
      # is pinned here rather than left to whatever the runner ships.
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      # `verify` runs the unit tests and the Testcontainers integration test; Docker is
      # already available on ubuntu-latest, so Postgres comes up for real.
      - name: Build and test
        run: mvn -B verify --file pom.xml

      - name: Publish test report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

      # Verifies the image builds from a clean checkout before main ever gets to CD.
      - name: Build the container image
        run: docker build -t tern:ci .

      # Optional: Uploads the full dependency graph to GitHub to improve the quality of Dependabot alerts this repository can receive
      - name: Update dependency graph
        if: github.event_name == 'push'
        uses: advanced-security/maven-dependency-submission-action@571e99aab1055c2e71a1e2309b9691de18d6b7d6
