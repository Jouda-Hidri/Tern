name: CD

# Only publishes what CI already proved green, rather than rebuilding and re-testing on a
# second trigger. A red CI run on main simply never reaches this workflow.
on:
  workflow_run:
    workflows: [ "CI" ]
    types: [ completed ]
    branches: [ "main" ]
  workflow_dispatch:

env:
  AWS_REGION: eu-central-1

jobs:
  publish:
    name: Publish image to ECR
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Lets GitHub mint the OIDC token that AWS exchanges for temporary credentials. There is
      # no AWS access key in this repository's secrets, so there is nothing to leak or rotate.
      id-token: write

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run starts from the default branch, so check out the commit CI tested.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # AWS_ROLE_ARN is a repository *variable*, not a secret: a role ARN is not sensitive, and
      # it is useless without a token from this repository on the ref the role's trust policy
      # names. See deployment/aws/ecr-oidc.yaml.
      - name: Assume the deployment role
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: tern-cd-${{ github.run_id }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Tags every build with its commit sha so a deployment can name exactly what it runs,
      # and moves `latest` alongside it for convenience.
      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ecr.outputs.registry }}/tern
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarise
        env:
          IMAGE: ${{ steps.ecr.outputs.registry }}/tern:sha-${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          {
            echo "### Published"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
            echo ""
            echo "Roll out with:"
            echo '```'
            echo "kubectl set image deployment/artic tern=$IMAGE"
            echo "kubectl set image deployment/antarctic tern=$IMAGE"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
