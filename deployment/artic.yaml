apiVersion: apps/v1
kind: Deployment
metadata:
  name: artic
spec:
  selector:
    matchLabels:
      app: artic
  replicas: 1
  template:
    metadata:
      labels:
        app: artic
    spec:
      containers:
        - name: tern
          image: tern:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres_db
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres_password
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres_host
            - name: SERVICE_NAME
              value: "artic"
            - name: ANTARCTIC_TARGET
              value: "antarctic.default.svc.cluster.local:30000"
            - name: TAPI_URL
              value: "http://tapi.default.svc.cluster.local:5000"
          ports:
            - containerPort: 8080
          # Liveness only restarts the pod if the JVM itself is wedged; readiness gates traffic.
          # Antarctic reachability is reported under /actuator/health but kept out of the
          # readiness group on purpose, so an antarctic outage does not also pull artic
          # out of the load balancer.
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
            requests:
              cpu: "0.5"
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: artic-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: artic
  minReplicas: 1
  maxReplicas: 1 # 10
  targetCPUUtilizationPercentage: 50

---
apiVersion: v1
kind: Service
metadata:
  name: artic
spec:
  type: NodePort
  ports:
    - protocol: "TCP"
      port: 8080
      targetPort: 8080
  selector:
    app: artic
