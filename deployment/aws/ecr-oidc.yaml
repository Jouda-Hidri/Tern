AWSTemplateFormatVersion: '2010-09-09'
Description: >
  ECR repository for the Tern image, plus an IAM role GitHub Actions can assume through OIDC
  to push to it. No AWS access keys are created, so there is nothing long-lived to leak or
  rotate - GitHub mints a short-lived token per run and STS exchanges it for credentials that
  expire with the job.

Parameters:
  GitHubRepository:
    Type: String
    Default: Jouda-Hidri/Tern
    Description: owner/repo allowed to assume the role.

  GitHubRef:
    Type: String
    Default: refs/heads/main
    Description: >
      Only runs on this ref may assume the role. CD is triggered by workflow_run, which reports
      the default branch, so main is the ref that matters. Widen to * only if you know why.

  RepositoryName:
    Type: String
    Default: tern

  CreateOidcProvider:
    Type: String
    Default: 'true'
    AllowedValues: ['true', 'false']
    Description: >
      An account can hold only one provider per URL. Set to false if something else in this
      account already registered token.actions.githubusercontent.com.

Conditions:
  ShouldCreateOidcProvider: !Equals [!Ref CreateOidcProvider, 'true']

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: ShouldCreateOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      # AWS verifies GitHub's certificate against its own trust store and ignores these, but
      # the API still requires the field. Both published thumbprints are listed.
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fce

  Repository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref RepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      # Mutable because CD moves the `latest` tag; the sha- tags it also pushes are the ones
      # a deployment should ever name.
      ImageTagMutability: MUTABLE
      # Every build produces a distinct image of roughly 340MB - the jar differs each time, so
      # layers are not shared between builds. At that size the free tier holds one image, and
      # keeping ten meant quietly running several times over it.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Drop untagged images promptly - each `latest` move orphans one",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 1
                },
                "action": { "type": "expire" }
              },
              {
                "rulePriority": 2,
                "description": "Keep only the last two tagged builds, to stay inside the free tier",
                "selection": {
                  "tagStatus": "tagged",
                  "tagPrefixList": ["sha-"],
                  "countType": "imageCountMoreThan",
                  "countNumber": 2
                },
                "action": { "type": "expire" }
              }
            ]
          }

  GitHubActionsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AWS::StackName}-github-actions'
      Description: Assumed by GitHub Actions to push images to ECR.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub 'arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com'
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                # Without the aud check the role would trust tokens minted for other audiences.
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                # And without the sub check, *any* GitHub repository could assume it.
                token.actions.githubusercontent.com:sub: !Sub 'repo:${GitHubRepository}:ref:${GitHubRef}'
      Policies:
        - PolicyName: push-to-ecr
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              # GetAuthorizationToken is account-wide by design; it cannot be scoped further.
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: '*'
              # Everything that actually touches images is limited to this one repository.
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt Repository.Arn

Outputs:
  RoleArn:
    Description: Set as the AWS_ROLE_ARN repository variable in GitHub.
    Value: !GetAtt GitHubActionsRole.Arn

  RepositoryUri:
    Description: The image repository CD pushes to.
    Value: !GetAtt Repository.RepositoryUri

  Region:
    Value: !Ref AWS::Region
