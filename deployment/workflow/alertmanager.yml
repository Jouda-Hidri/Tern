route:
  receiver: tern-workflow
  group_by: [alertname, service]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 1h

receivers:
  - name: tern-workflow
    webhook_configs:
      # Alertmanager cannot sign its webhooks, so leave WORKFLOW_WEBHOOK_SECRET unset when this
      # is the only sender and keep the endpoint off the public internet. incident.io does sign,
      # which is what the secret and X-Incident-Signature header are for.
      #
      # The host rather than `artic`, so that one URL works wherever artic is. Compose publishes
      # 8080 on the host, so this reaches the container; and it still reaches artic when it is
      # run on the machine instead, which is what run-local.sh does to borrow a Claude session.
      # `artic` would only have worked for the first of those.
      - url: http://host.docker.internal:8080/workflow/alerts
        send_resolved: false
        max_alerts: 5
