groups:
  - name: tern
    rules:
      - alert: TernArticErrors
        expr: sum(rate(http_server_requests_seconds_count{application="artic",status=~"5.."}[2m])) > 0
        for: 1m
        labels:
          severity: critical
          service: artic
        annotations:
          summary: artic is answering 5xx
          description: >-
            artic has returned at least one 5xx in the last two minutes. Antarctic being down
            answers 503 or 504 on every path, so start there before looking at artic itself.

      - alert: TernTargetDown
        expr: up{job="tern"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "{{ $labels.role }} has stopped answering scrapes"
          description: Prometheus cannot reach {{ $labels.instance }}.

      - alert: TernWriteLatencyHigh
        expr: >-
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="artic",method="POST"}[5m]))) > 2
        for: 5m
        labels:
          severity: warning
          service: artic
        annotations:
          summary: p95 write latency is over two seconds
          description: >-
            A POST waits TRANSLATE_TIMEOUT for the detector and is bounded by ANTARCTIC_DEADLINE,
            so a slow detector shows up here before it shows up as an error.

      - alert: TernLanguageDetectionDegraded
        expr: >-
          sum(increase(http_server_requests_seconds_count{application="artic",uri="/",method="POST",status="201"}[10m])) > 0
          and on() absent(up{job="tern",role="antarctic"} == 1)
        for: 5m
        labels:
          severity: warning
          service: antarctic
        annotations:
          summary: writes are landing while antarctic is unscrapeable
          description: Antarctic is not reporting metrics but artic is still confirming writes.
