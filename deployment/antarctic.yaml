apiVersion: apps/v1
kind: Deployment
metadata:
  name: antarctic
spec:
  selector:
    matchLabels:
      app: antarctic
  replicas: 1
  template:
    metadata:
      labels:
        app: antarctic
    spec:
      containers:
        - name: tern
          image: tern:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres_password
            - name: POSTGRES_HOST
              valueFrom:
                configMapKeyRef:
                  name: postgres-config
                  key: postgres_host
            - name: SERVICE_NAME
              value: "antarctic"
          ports:
            - containerPort: 9090
            - containerPort: 8080   # actuator only; no Service points at it
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 3
          resources:
            limits:
              cpu: "1"
            requests:
              cpu: "0.5"
---
apiVersion: autoscaling/v1
kind: HorizontalPodAutoscaler
metadata:
  name: antarctic-hpa
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: antarctic
  minReplicas: 1
  maxReplicas: 1 #10
  targetCPUUtilizationPercentage: 50

---
apiVersion: v1
kind: Service
metadata:
  name: antarctic
spec:
  ports:
    - protocol: "TCP"
      port: 30000
      targetPort: 9090
  selector:
    app: antarctic
